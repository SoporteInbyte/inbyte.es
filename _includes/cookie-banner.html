<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Aviso de cookies">
  <div class="cookie-content">
    <p>
      Utilizamos cookies propias y de terceros para medir el uso de la web y mejorar nuestro servicio. Puedes aceptarlas, rechazarlas o consultar los detalles en nuestra <a href="/pages/cookies.html">Política de Cookies</a>.
    </p>
    <div class="cookie-buttons">
      <button type="button" id="btn-cookie-accept" class="btn-cookie-accept">Aceptar todas</button>
      <button type="button" id="btn-cookie-reject" class="btn-cookie-reject">Rechazar</button>
    </div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var banner = document.getElementById('cookie-banner');
    if (!banner) return;
    var btnAccept = document.getElementById('btn-cookie-accept');
    var btnReject = document.getElementById('btn-cookie-reject');
    var consent = null;
    try { consent = localStorage.getItem('inbyte_cookie_consent'); } catch (e) {}
    function applyUpdate(state) {
      if (typeof gtag !== 'function') return;
      if (state === 'accepted') {
        gtag('consent', 'update', {'ad_storage':'granted','ad_user_data':'granted','ad_personalization':'granted','analytics_storage':'granted'});
      } else {
        gtag('consent', 'update', {'ad_storage':'denied','ad_user_data':'denied','ad_personalization':'denied','analytics_storage':'denied'});
      }
    }
    if (consent === 'accepted') { applyUpdate('accepted'); return; }
    if (consent === 'rejected') { return; }
    banner.style.display = 'block';
    btnAccept.addEventListener('click', function() {
      try { localStorage.setItem('inbyte_cookie_consent', 'accepted'); } catch (e) {}
      applyUpdate('accepted');
      banner.style.display = 'none';
    });
    btnReject.addEventListener('click', function() {
      try { localStorage.setItem('inbyte_cookie_consent', 'rejected'); } catch (e) {}
      applyUpdate('rejected');
      banner.style.display = 'none';
    });
  });
</script>
